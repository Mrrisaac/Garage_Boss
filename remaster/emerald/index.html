<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05060b"><title>Garage Boss Remastered: The Rusty Scratch</title><style>html,body{margin:0;min-height:100%;background:#020309;color:#fff;font:16px monospace;display:grid;place-items:center}.loading{padding:2rem;text-align:center}</style></head><body><div class="loading">LOADING EMERALD GARAGE...</div><script>(async()=>{try{const names=[1,2,3,4,5,6,7].map(n=>`bundle-${String(n).padStart(2,"0")}.b64?v=2`);const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:"no-store"});if(!r.ok)throw new Error(n+" unavailable");return r.text()}));const b=Uint8Array.from(atob(parts.join("").replace(/\s/g,"")),c=>c.charCodeAt(0));const s=new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"));const h=await new Response(s).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML="<main class=loading>THE REMASTER COULD NOT START.<br><br>"+String(e)+"</main>"}})();</script></body></html>
