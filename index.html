<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05050a">
  <meta name="description" content="Garage Boss Remastered, an original 320 by 200 VGA-style point-and-click parking adventure.">
  <title>Garage Boss Remastered: Headquarters Benchmark</title>
</head>
<body>
  <main id="page">
    <section id="shell" aria-label="Garage Boss Remastered game">
      <canvas id="game" width="320" height="200" tabindex="0" aria-label="Playable VGA-style point-and-click adventure"></canvas>
      <form id="commandBar" hidden autocomplete="off" aria-label="Classic text command parser">
        <span>&gt;</span>
        <input id="commandInput" type="text" maxlength="80" spellcheck="false" aria-label="Enter a command such as look at phone">
        <button id="commandSend" type="button">ENTER</button>
      </form>
    </section>

    <nav id="utility" aria-label="Game utilities">
      <button id="fullscreen" type="button">FULL SCREEN</button>
      <button id="musicToggle" type="button">MUSIC: ON</button>
      <button id="sfxToggle" type="button">SFX: ON</button>
      <a href="../">CLASSIC EDITION</a>
      <span>REMASTER BENCHMARK 0.1</span>
    </nav>

    <p id="instructions">
      Tap a verb, then tap an object. Choose TYPE for the classic parser. Keyboard: W, L, T, G, U, Enter, F5, F9, Esc.
    </p>
  </main>
  <noscript>This game needs JavaScript enabled.</noscript>
  <script>
  (()=>{
    const ROOT='https://raw.githubusercontent.com/Mrrisaac/Garage_Boss/remaster/remaster-build/';
    const PATCHES=[["const fullscreenButton = document.getElementById('fullscreen');","const fullscreenButton = document.getElementById('fullscreen');\nconst musicButton = document.getElementById('musicToggle');\nconst sfxButton = document.getElementById('sfxToggle');"],["function toggleAudio(){S.audio=!S.audio;toast(S.audio?'SOUND ON':'SOUND OFF');if(S.audio)ensureAudio();}\nfunction toggleMusic(){S.music=!S.music;if(S.music){ensureAudio();startMusic()}else{clearInterval(musicTimer);musicTimer=null}toast(S.music?'MUSIC ON':'MUSIC OFF');}","function updateAudioButtons(){if(sfxButton)sfxButton.textContent=`SFX: ${S.audio?'ON':'OFF'}`;if(musicButton)musicButton.textContent=`MUSIC: ${S.music?'ON':'OFF'}`;}\nfunction toggleAudio(){S.audio=!S.audio;toast(S.audio?'SOUND ON':'SOUND OFF');if(S.audio)ensureAudio();updateAudioButtons();}\nfunction toggleMusic(){S.music=!S.music;if(S.music){ensureAudio();startMusic()}else{clearInterval(musicTimer);musicTimer=null}toast(S.music?'MUSIC ON':'MUSIC OFF');updateAudioButtons();}"],["function hotspotAt(x,y){\n  if(y<TOP||y>=SCENE_BOTTOM)return null;\n  for(let i=HOTSPOTS.length-1;i>=0;i--)if(inside(x,y,HOTSPOTS[i].rect))return HOTSPOTS[i];\n  return null;\n}","function hotspotAt(x,y){\n  if(y<TOP||y>=SCENE_BOTTOM)return null;\n  const matches=HOTSPOTS.filter(h=>inside(x,y,h.rect));\n  if(!matches.length)return null;\n  // Small, specific objects such as the phone and monitor must win over the desk behind them.\n  matches.sort((a,b)=>(a.rect[2]*a.rect[3])-(b.rect[2]*b.rect[3]));\n  return matches[0];\n}"],["  r(0,185,W,15,C.navy);r(0,185,W,1,C.gray);\n  const prefix=S.hover&&S.mode==='room'?`${S.verb.toUpperCase()} ${S.hover}: `:'';\n  const msg=(prefix+S.message).slice(0,104);drawWrapped(msg,4,188,51,C.ink,8,1,2);\n  pxText(`${casesDone()}/2`,300,188,S.flags.benchmarkComplete?C.brightGreen:C.gold,1,'right');","  r(0,184,W,16,C.navy);r(0,184,W,1,C.gray);\n  const prefix=S.hover&&S.mode==='room'?`${S.verb.toUpperCase()} ${S.hover}: `:'';\n  const msg=(prefix+S.message).slice(0,92);drawWrapped(msg,4,185,46,C.ink,7,1,2);\n  pxText(`${casesDone()}/2`,316,185,S.flags.benchmarkComplete?C.brightGreen:C.gold,1,'right');"],["function drawCutscene(now){\n  drawStatusBar();","function drawCutscene(now){\n  r(0,0,W,H,C.black);\n  drawStatusBar();"],["document.addEventListener('visibilitychange',()=>{if(document.hidden)autosave()});\nfullscreenButton.addEventListener","document.addEventListener('visibilitychange',()=>{if(document.hidden)autosave()});\nif(sfxButton)sfxButton.addEventListener('click',()=>{ensureAudio();toggleAudio()});\nif(musicButton)musicButton.addEventListener('click',()=>{ensureAudio();toggleMusic()});\nupdateAudioButtons();\nfullscreenButton.addEventListener"]];
    const get=name=>fetch(ROOT+name+'?v=benchmark-2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(name+' failed to load');return r.text()});
    const unzip=async data=>{
      const bytes=Uint8Array.from(atob(data.trim()),c=>c.charCodeAt(0));
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    };
    Promise.all([
      get('css.gz.b64'),get('js-01.b64'),get('js-02.b64'),get('js-03a.b64'),get('js-03b.b64'),get('js-04a.b64'),get('js-04b.b64')
    ]).then(async ([css,...parts])=>{
      const [styleText,originalScript]=await Promise.all([unzip(css),unzip(parts.join(''))]);
      let scriptText=originalScript;
      for(const [before,after] of PATCHES){
        if(!scriptText.includes(before))throw new Error('Remaster patch mismatch');
        scriptText=scriptText.replace(before,after);
      }
      const style=document.createElement('style');style.textContent=styleText;document.head.appendChild(style);
      Function(scriptText)();
    }).catch(err=>{
      document.body.innerHTML='<main style="color:white;background:black;min-height:100vh;padding:2rem;font:16px monospace">The remaster could not start. Please refresh in a current version of Chrome, Edge, Firefox, or Safari.<br><br>'+String(err)+'</main>';
    });
  })();
  </script>
</body>
</html>
